name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Check migrations are committed
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::Schema changed without committed migrations. Run 'pnpm db:generate' and commit the generated files in drizzle/."
            git status --porcelain drizzle/
            exit 1
          fi

      - name: Build
        run: pnpm build
